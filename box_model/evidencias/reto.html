<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>documento</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;

        }

        .card-container{
            padding:6px;
            border-radius:20px;
            background: #f7f6f4;
        }

        .card{
            background:#3f3f46;
            border-radius:15px;
            width:260px;
            text-align:center;
            overflow:hidden;
        }

        .card img{
            width:100%;
            height:180px;
            object-fit:cover;
            border-radius:15px;
            border:6px solid #ffae00,;
        }

        .card-content{
            padding:15px;
        }

        .card h3{
            color:#fbbf24;
            margin-bottom:10px;
        }

        .card p{
            color:#d4d4d8;
            font-size:14px;
            margin-bottom:15px;
        }

        .card button{
            background:#f59e0b;
            border:none;
            padding:10px 20px;
            border-radius:8px;
            color:white;
            cursor:pointer;
            font-weight:bold;
        }

        .card button:hover{
            background:#d97706;
        }
    </style>
</head>

<body>

    <div class="card-container">
        <div class="card">
            <img src="retrato.jpg" alt="retrato">
            <div class="card-content">
                <h3>Samumu Muñez</h3>
                <p>
                    Software engineer with a knack for problem-solving. 
                    I thrive on coding challenges and crafting elegant solutions.
                </p>
                <button>Follow</button>
            </div>
        </div>
    </div>

</body>
</html>
