<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width= , initial-scale=1.0">
    <title>Document</title>
    <style>
        /* importacion de fuentes*/
        @font-face {
            font-family: 'inter';
            src: url('inter/Inter-Italic.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
            
        }
        @font-face {
            font-family: 'inter';
            src: url('inter/Inter-Italic.ttf') format('truetype');
            font-weight: 700;
            font-style: bold;
            font-display: swap;
            
        }
        /*reeseteo de estilos */
        *{
            margin: 0;
            padding: 0;
        }

        /*body*/
        body{
            background-color: lightgrey;
            /* fuente */
            font-family: 'inter', sans-serif;
        }

        /* BEM: bloque (contenedor
        Elemento
        modificador)
        */
    .card{
        /* tamaño */
        width: 300px;
        height: auto;
        /*fondo*/ 
    background-color: white;

    /*centrado*/
    margin-top: 20px;
    margin-left: auto;
    margin-right: auto;
    box-shadow: 5px 1px 13px 4px rgba(217, 214, 214, 0.75);
    border-radius: 15px;
    }

    .card__empresa{
        width: auto;
        height: 100px;

        background-color: #3e3e40;
        border-top-left-radius: 15px;
        border-top-right-radius: 15px;
        /*texto*/
        color: white;
        font-size: 20px;
        font-weight: bold;
        text-align: center;
        padding-top: 50px;
    }

    .card__flag{
        background-color: #76C4C4;
        height: 60px;
    }

    .card__retrato{
        width: 100px;
        height: 100px;
        display: block;
        /*distorcion*/
        object-fit: cover;
        /*posicionamiento*/
        margin-left: auto;
        margin-right: auto;
        margin-top: -100px;
        /*borde*/
        border-radius: 50%;
        border: white solid 5px;

    }
    .card__nombre{
        text-align: center;
        margin-top: 10px;
        margin-left: auto;
        margin-right: auto;
        font-size: 20px;
        /* epaciar las letras*/
        letter-spacing: 3px;
    }


    .card__nombre--negrita{
        font-weight: bold;
    }
    
    .card__profesion{
        text-align: center;
        margin-top: 9px;
        font-size:10px;
        letter-spacing:2px;
        color:#76C4C4;
    }

    .card__tabla{
        font-size: 10px;
        width: 200px;
        /* centrado */
        margin-left: auto;
        margin-right: auto;
        margin-top: 20px;
    }

    .card__tabla--atributo{
        font-weight: bold;
        color: #76C4C4;
    }

    </style>
</head>
<body>
    <!--contenedor-->
    <div class="card"> 
        <!--empresa-->
           <div class="card__empresa">
                SENA CGMLTI
           </div>
           <!--flag-turquesa-->     
           <div class="card__flag"></div>
           <!--retrato-->
           <img class="card__retrato"
                src="retrato.jpg"
                alt="retrato"
            <!-- nombre -->
            
           <div class="card__nombre">Susana
                                    <span class="card__nombre--negrita">Nosano</span>
           </div>
           <!-- profesion -->
        
           <div class="card__profesion">Web desing y Developer</div>
           <table class="card__tabla">
            <tr>
                <td class="card__tabla--atributo">ID</td>
                <td>2345</td>
            </tr>
            <tr>
                <td class="card__tabla--atributo">Documento</td>
                <td>43463645</td>
            </tr>
            <tr>
                <td class="card__tabla--atributo">correo</td>
                <td>susana.nosanoova33@gmail.com</td>
            </tr>
           </table>
    </div>
</body>
</html>
